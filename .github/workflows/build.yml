name: Verify resume

# Inspects only -- this workflow never commits or pushes. Generation happens
# locally via hooks/pre-commit, which is what keeps main free of bot commits.
on:
  push:
    branches: [main]
    paths:
      - content/**
      - master.tex
      - markdown.tex
      - readme-header.md
      - build.sh
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: master.tex
          latexmk_use_lualatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Check README is up to date
        run: |
          cp readme-header.md README.expected.md
          pandoc markdown.tex -t gfm --wrap=none --shift-heading-level-by=1 \
            >> README.expected.md
          if ! diff -q README.md README.expected.md >/dev/null; then
            echo "::error::README.md is stale. Run ./build.sh and amend your commit."
            diff README.md README.expected.md || true
            exit 1
          fi
          rm README.expected.md
