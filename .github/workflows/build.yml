name: Verify resume

# Inspects only -- this workflow never commits or pushes. Generation happens
# locally via hooks/pre-commit, which is what keeps main free of bot commits.
on:
  push:
    branches: [main]
    paths:
      - content/**
      - master.tex
      - markdown.tex
      - readme-header.md
      - build.sh
      - .pandoc-version
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must be the version in .pandoc-version, not whatever the runner image
      # ships: pandoc's gfm writer formats bullets and pipes differently across
      # releases, so an unpinned pandoc fails the README check below on
      # formatting alone. build.sh enforces the same pin locally.
      - name: Install pinned pandoc
        run: |
          version=$(cat .pandoc-version)
          curl -fL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${version}/pandoc-${version}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: master.tex
          latexmk_use_lualatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Check README is up to date
        run: |
          cp readme-header.md README.expected.md
          pandoc markdown.tex -t gfm --wrap=none --shift-heading-level-by=1 \
            >> README.expected.md
          if ! diff -q README.md README.expected.md >/dev/null; then
            echo "::error::README.md is stale. Run ./build.sh and amend your commit."
            diff README.md README.expected.md || true
            exit 1
          fi
          rm README.expected.md
